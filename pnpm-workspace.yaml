packages:
  - packages/**
  - examples/**
catalogs:
  intlify:
    '@intlify/shared': next
    vue-i18n: next
  vite:
    '@vitejs/plugin-vue': ^6.0.6
    vite: 6.4.4
  vite8:
    vite: ^8.0.0
  vue:
    vue: ~3.6.0-rc.12
  webpack:
    ts-loader: ~9.6.0
    vue-loader: ~17.4.2
    webpack: ~5.106.2
catalog:
  '@types/node': ^25.7.0
  unbuild: ^3.6.1
  source-map-js: ^1.2.1
allowBuilds:
  esbuild: true
  oxc-resolver: true
  unrs-resolver: true
# pnpm 11 holds back a version for a day after it is published (minimumReleaseAge), also when it
# verifies the lockfile. vue-i18n 12.0.0-alpha.7 came out on 2026-10-18; these entries can go after
# 2026-10-19 07:56 UTC.
minimumReleaseAgeExclude:
  - '@intlify/core-base@12.0.0-alpha.7'
  - '@intlify/devtools-types@12.0.0-alpha.7'
  - '@intlify/message-compiler@12.0.0-alpha.7'
  - '@intlify/shared@12.0.0-alpha.7'
  - '@intlify/vue-i18n-core@12.0.0-alpha.7'
  - petite-vue-i18n@12.0.0-alpha.7
  - vue-i18n@12.0.0-alpha.7
overrides:
  '@intlify/shared': next
  '@intlify/message-compiler': next
  '@intlify/core-base': next
  '@intlify/vue-i18n-core': next
  vue-i18n: next
  petite-vue-i18n: next
